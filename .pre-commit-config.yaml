repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run --locked ruff format
        language: system
        types_or: [python, pyi]
        stages: [pre-commit]

      - id: ruff-check-fix
        name: ruff check --fix
        entry: uv run --locked ruff check --fix
        language: system
        types_or: [python, pyi]
        stages: [pre-commit]

      - id: pyright
        name: pyright
        entry: uv run --locked pyright
        language: system
        pass_filenames: false
        files: ^(?:src/.*\.pyi?|examples/impl-review-orchestrator/.*\.pyi?|pyproject\.toml|uv\.lock)$
        exclude: (?:^|/)test_.*\.py$
        stages: [pre-commit]

      - id: check-md-links
        name: check markdown links
        entry: uv run --locked python scripts/check_md_links.py
        language: system
        types: [markdown]
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: check-codex-reference
        name: check Codex reference
        entry: uv run --locked python scripts/check_codex_reference.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: pytest
        name: pytest
        entry: uv run --locked pytest
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: uv-build
        name: uv build
        entry: uv build
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
