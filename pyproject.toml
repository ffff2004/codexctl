[project]
name = "codexctl"
version = "0.1.0"
description = "Command-line interface for starting, resuming, observing, steering, and interrupting Codex threads through a shared Codex runtime."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "websockets>=13.0",
]

[project.scripts]
codexctl = "codexctl.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codexctl"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
