[project]
name = "codexctl"
version = "0.1.0"
description = "Command-line interface for starting, resuming, observing, steering, and interrupting Codex threads through a shared Codex runtime."
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
dependencies = [
    "websockets>=13.0",
]

[project.scripts]
codexctl = "codexctl.cli:main"

[dependency-groups]
dev = [
    "pre-commit>=4.0",
    "pyright>=1.1.406",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codexctl"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "examples/impl-review-orchestrator"]

[tool.ruff]
target-version = "py314"
line-length = 88
exclude = ["vendor"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
include = ["src", "examples/impl-review-orchestrator"]
exclude = ["vendor", ".venv", "dist", "tests"]
pythonVersion = "3.14"
typeCheckingMode = "standard"
